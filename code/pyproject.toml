[project]
name = "digit-augmentation"
version = "1.0.0"
description = "Generator augmentasi untuk dataset digit tulisan tangan 0-9 (UAS Machine Learning)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy==2.4.6",
    "pillow==12.2.0",
    "scipy==1.17.1",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Paket `digit_aug` berada di root proyek; pastikan root ikut di sys.path
# sehingga `import digit_aug` bekerja juga saat pytest dijalankan dari
# direktori lain.
pythonpath = ["."]
